# Large print: caps where the print sits closer to the camera, so the
# characters are taller than the 45 px line height the reader tries by
# default (the "P21/1 KT" cap, 6303 10:48: every read NOK format_mismatch,
# the top and bottom dot rows fell outside the text lines).
#
# Measured on data/eerlijke_test (2026-11-10, 148 frames of 7 caps none of
# the models was trained on), model 5 (font_reader.npz), no numba, against
# the standard profile (correct / WRONG / NOK):
#   P21/1 KT cap (10:48)    0 / 0 / 30  ->  28 / 0 / 2
#   X-rib cap (10:49)       3 / 0 / 37  ->  16 / 4 / 20
#   the other five caps    75 / 0 / 3   ->  74 / 0 / 4
# The X-rib cap prints over the rib crossing; with taller lines more of its
# rib-damaged digits get read, some wrongly ("6323", "6503"; on the 131
# frames of that cap from 2026-11-06: 17 -> 20 WRONG). Use this profile for
# the P21/1 KT cap, NOT for the X-rib cap.
label: "Large print (P21/1 KT cap)"
description: "Text lines up to 64 px tall; standard settings otherwise."
ocr:
  read_validation:
    font_reader:
      max_line_height_px: 64
